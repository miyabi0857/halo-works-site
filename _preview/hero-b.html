<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>B案ヒーロー 確認用｜Gear Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   B案ヒーロー：歯車が回りながら花に変わる
   確定ロゴは「歯車が花に変わる途中の1フレーム」だったので、
   もともとマークに埋まっていた動きを取り出しているだけ。

   骨格はルール2に従って「訪問者がここで何をしたいか」から決め直した。
   このページに来る人の大半はDMで叩き台リンクを受け取った店主で、
   一番知りたいのは「この人は本物か」。だから
   ファーストビューで最大の文字は、読める日本語の名乗りにする。
   （現行は WEB MADE TO LAST が86.4px、直下の日本語が24px だった）

   使った技（技の引き出しより）：
   ・1字ずつ潰れた状態から弾性で立ち上げる（e-chubu）
   ・分割DOMを onComplete で revert する（e-chubu）
   ・マスクの幅を伸ばして線を描く（toyox）
   ・CSS変数ひとつで進行度を配る（upvege）
   ============================================================ */

:root{
  --bg:#faf8f4; --surface:#ffffff;
  --ink:#1a1310; --ink-soft:#5c4d44; --ink-faint:#8a7a6e;
  --accent:#c2401f; --accent-ink:#8f3a20;
  --sand:#eee3d5; --line:#e5ddd2;
}
/* ダークの --accent(#e2653f) に白文字だとコントラストが3.41しかなく、
   0.95rem太字は「大きい文字」の緩和も受けられないため基準4.5に届かない。
   文字を地色側(#1a1512)に振ると5.32になる（実測） */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1512; --surface:#221b17;
    --ink:#efe7dd; --ink-soft:#b5a89d; --ink-faint:#85786d;
    --accent:#e2653f; --accent-ink:#efa88e;
    --sand:#6b5546; --line:#362b24;
  }
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Archivo','Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  line-height:1.75;
}

/* ---- 進行度。JSが --bloom を1つ書くだけ（upvegeの考え方） ---- */
/* 舞台を貼り付けて、余分な高さぶんだけ「咲く」進行に使う。
   これが無いと、満開に届く前にヒーローを通り過ぎてしまう（実測 0.559 で頭打ちだった）。
   sticky なので中身は常に画面に収まり、position:fixed のような取り回しの悪さがない */
.hero{ --bloom:0; position:relative; padding:0 0 40px; }
/* 貼り付ける場合、下の余白は sticky の可動域を食う（実測40px分ずれた）。
   余白は次のセクション側で取る */
html.js .hero{ height:230svh; padding-bottom:0; }
html.js .hero__sticky{ position:sticky; top:0; min-height:100svh; display:flex;
  flex-direction:column; justify-content:center; overflow:clip; }
html:not(.js) .hero__sticky{ overflow:clip; }

/* ---- 罫線だけのラベル（既存の .eyebrow を踏襲） ---- */
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-size:.72rem;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent-ink);margin:0 0 1.4em;
}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);flex-shrink:0}

/* ---- 舞台。左右非対称にして、見出しを左の断ち落としへ寄せる ---- */
.stage{
  position:relative;
  min-height:auto;
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  align-items:center;
  gap:clamp(20px,4vw,64px);
  max-width:1220px;margin:0 auto;padding:clamp(48px,7vw,86px) 24px 0;
}

/* ---- 見出し：ここが画面で一番大きい。和文。 ---- */
.copy{position:relative;z-index:2;min-width:0}
.h1{
  font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  font-weight:900;
  /* 一番長い行「ホームページを」は全角7文字。桁からあふれない上限で刻む。
     1440pxで約83px、390pxで約35px。自動折り返しに任せると
     「ホームペ／ージを」のように語の途中で折れるので、行は明示する */
  font-size:clamp(2.2rem,9vw,5.2rem);
  line-height:1.16;
  letter-spacing:-.015em;
  margin:0 0 .46em;
}
.h1 .ln{display:block;white-space:nowrap}
.h1 .sm{font-size:.52em;font-weight:700;letter-spacing:.01em}
.h1 .mark{color:var(--accent)}

.sub{
  font-size:clamp(.98rem,1.5vw,1.14rem);
  color:var(--ink-soft);max-width:30em;margin:0 0 2em;
}

/* ---- 線：マスクの幅を伸ばして描く（toyox） ---- */
.rule{
  width:min(420px,100%);height:2px;background:var(--accent);
  margin:0 0 2em;
  -webkit-mask-image:linear-gradient(90deg,#000 50%,transparent);
          mask-image:linear-gradient(90deg,#000 50%,transparent);
  -webkit-mask-size:.01% 100%; mask-size:.01% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
}
html.js .rule.is-visible{animation:revealFromLeft 1.1s .5s ease-out forwards}
@keyframes revealFromLeft{
  from{-webkit-mask-size:.01% 100%;mask-size:.01% 100%}
  to  {-webkit-mask-size:200%  100%;mask-size:200%  100%}
}
/* JSが来ないときは線を最初から出す */
html:not(.js) .rule{-webkit-mask-image:none;mask-image:none}

.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 30px;border-radius:999px;
  font-weight:700;font-size:.95rem;line-height:1.4;
  border:1.5px solid transparent;text-decoration:none;cursor:pointer;
  transition:background-color .2s,color .2s,border-color .2s;
}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .btn-primary{color:#1a1512}
  :root:not([data-theme="light"]) .btn-primary:hover{color:#1a1512}
  :root:not([data-theme="light"]) .btn-ghost:hover{color:#1a1512}
}
.btn-ghost{background:transparent;border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost:hover{background:var(--accent);color:#fff}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---- マーク。右カラムに置き、左の見出しの下へ食い込ませる（要素を重ねる） ---- */
.markwrap{
  position:relative;min-width:0;justify-self:center;
  width:min(100%,560px);
  margin-left:clamp(-90px,-6vw,0px);
  z-index:1;
}
.markwrap svg{
  display:block;width:100%;height:auto;
  color:var(--accent);
  /* 咲くにつれて少しだけ回る。回転もCSS側が --bloom から出す */
  transform:rotate(calc(var(--bloom) * 40deg));
  transform-origin:50% 50%;
  transition:transform .12s linear;
}
/* 地の方眼。既存ヒーローの目を踏襲するが、マークの後ろだけに敷く */
.markwrap::before{
  content:"";position:absolute;inset:-12%;
  background-image:
    linear-gradient(to right, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 42%, transparent 72%);
          mask-image:radial-gradient(circle at 50% 50%, #000 42%, transparent 72%);
  pointer-events:none;
}

/* ---- 咲ききったところで出る一文 ---- */
.tell{
  position:relative;z-index:2;
  max-width:1220px;margin:0 auto;padding:0 24px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(20px,4vw,64px);
}
/* 一文が出るときに高さが変わると、貼り付けた中身ごと下へずれる。
   出る前から場所を取らせて、動かないようにする */
.tell{min-height:6.2em}
.tell__inner{
  grid-column:2;
  font-size:clamp(.92rem,1.4vw,1.04rem);
  color:var(--ink-soft);
  border-left:2px solid var(--accent);
  padding:2px 0 2px 18px;
  /* 咲く進行に合わせて出す。JSが来なければ最初から見える */
  opacity:1;
}
html.js .tell__inner{
  opacity:calc((var(--bloom) - .55) * 3);
  transform:translateY(calc((1 - var(--bloom)) * 14px));
  transition:opacity .2s linear, transform .2s linear;
}
.tell__inner b{color:var(--ink);font-weight:700}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;min-height:auto;padding-top:22px;gap:18px}
  html.js .hero{height:200svh}
  /* 貼り付ける中身が画面より高いと、はみ出した分だけ中身がずれる
     （実測：中身1025px / 画面844px で211pxのずれ）。
     マークを絞って1画面に収める */
  /* 画面高とちょうど同値だと端数で動くので、50pxほど余裕を残す */
  .markwrap{margin-left:0;width:min(50%,196px);order:2;margin-inline:auto}
  .copy{order:1}
  .sub{margin-bottom:1.2em}
  /* ボタンが縦積みだと121px使い、貼り付けた中身が画面に収まらない。
     左右の余白を詰めて1行に並べる（実測で866px→803pxになる） */
  .cta{gap:8px;flex-wrap:nowrap}
  .btn{padding:14px 18px;font-size:.88rem;white-space:nowrap}
  .tell{grid-template-columns:1fr;margin-top:12px;min-height:5.8em}
  .tell__inner{grid-column:1}
}
@media (max-width:900px) and (max-height:700px){
  .markwrap{width:min(46%,180px)}
  .tell{min-height:5.2em}
}
@media (prefers-reduced-motion:reduce){
  .markwrap svg{transform:none;transition:none}
  .rule{-webkit-mask-image:none;mask-image:none;animation:none}
  html.js .tell__inner{opacity:1;transform:none}
}

/* 確認用の余白。本番では次のセクション（制作実績）が来る */
.after{max-width:1220px;margin:0 auto;padding:60px 24px 160px;color:var(--ink-faint);font-size:.82rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<script>document.documentElement.className+=' js';</script>

<section class="hero" id="hero">
 <div class="hero__sticky">
  <div class="stage">
    <div class="copy">
      <span class="eyebrow">Nagasaki, Japan</span>
      <h1 class="h1"><span class="split"><span class="ln">長崎で、</span><span class="ln">ホームページを</span><span class="ln">作っています</span></span></h1>
      <div class="rule" id="rule"></div>
      <p class="sub">
        Web制作・業務アプリ・Excelマクロ。会社ではなく、野﨑大雅が一人で、
        最初から最後まで受け持ちます。
      </p>
      <div class="cta">
        <a href="../contact.html" class="btn btn-primary">依頼・相談してみる</a>
        <a href="../portfolio.html" class="btn btn-ghost">実績を見る</a>
      </div>
    </div>

    <div class="markwrap">
      <svg viewBox="0 0 160 160" role="img" aria-label="歯車の歯が、回りながら花びらへ変わっていくマーク">
        <!-- 既定は確定ロゴ（b=0.5）そのもの。JSが動かなくてもマークは出る。
             JSはこの d を書き換えて咲かせるだけ -->
        <path id="markPath" fill="currentColor" fill-rule="evenodd" d="M70.08,45.39 Q70.96,42.10 71.84,38.80 Q80.00,38.80 88.16,38.80 Q89.04,42.10 89.92,45.39 A36.00,36.00 0 0 1 94.64,47.11 Q98.17,43.62 103.74,41.18 Q110.72,45.58 115.88,52.02 Q113.53,56.89 109.85,59.87 A36.00,36.00 0 0 1 112.36,64.22 Q118.85,63.17 127.13,66.58 Q130.76,74.22 128.94,82.48 Q122.12,85.52 115.80,83.76 A36.00,36.00 0 0 1 114.93,88.71 Q122.13,92.63 126.88,103.63 Q125.77,112.35 117.92,116.30 Q108.71,113.66 105.01,105.90 A36.00,36.00 0 0 1 101.16,109.12 Q104.92,118.20 99.70,132.42 Q93.72,139.44 85.27,135.75 Q78.68,125.98 82.51,115.91 A36.00,36.00 0 0 1 77.49,115.91 Q74.14,126.83 57.66,135.15 Q48.27,137.84 45.49,128.47 Q46.96,114.47 58.84,109.12 A36.00,36.00 0 0 1 54.99,105.90 Q44.08,112.97 23.04,106.92 Q13.14,103.68 18.79,94.92 Q30.62,83.50 45.07,88.71 A36.00,36.00 0 0 1 44.20,83.76 Q29.75,81.91 16.53,60.17 Q9.77,51.27 20.83,49.65 Q39.68,48.36 47.64,64.22 A36.00,36.00 0 0 1 50.15,59.87 Q39.33,47.95 45.00,19.38 Q44.57,7.35 53.78,15.10 Q71.09,27.76 65.36,47.11 A36.00,36.00 0 0 1 70.08,45.39 Z M80.00,80.00 m-13.00,0 a13.00,13.00 0 1,0 26.00,0 a13.00,13.00 0 1,0 -26.00,0 Z"/>
      </svg>
    </div>
  </div>

  <div class="tell">
    <p class="tell__inner">
      歯車の歯は、回るうちに花びらへ変わります。<b>Gear Bloom</b> という名前は、そこから取りました。
      ホームページも、業務アプリも、Excelのマクロも、<b>お店の歯車をひとつ回す仕事</b>だと思っています。
    </p>
  </div>
 </div>
</section>

<div class="after">ここから下に、制作実績（ReAct!! ／ なぎさ堂 ／ トラットリア南風）が続きます。</div>

<script src="gsap.min.js"></script>
<script src="SplitText.min.js"></script>
<script src="mark-morph.js"></script>
<script>
(function () {
  var path = document.getElementById('markPath');
  var hero = document.getElementById('hero');
  if (!path || typeof markPath !== 'function') return;

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 既定の d はHTML側に確定ロゴを直接書いてあるので、ここでは何もしない。
     動きを減らす設定なら、その確定ロゴのまま止める（ルール5の鉄則） */
  if (reduce) return;

  var ticking = false;
  function update() {
    var r = hero.getBoundingClientRect();
    /* 貼り付けの可動域は「ヒーローの高さ - 下の余白 - 画面1つぶん」。
       下の余白を引き忘れると、咲ききる前に貼り付けが外れる */
    var padB = parseFloat(getComputedStyle(hero).paddingBottom) || 0;
    var span = Math.max(1, r.height - padB - innerHeight);
    var p = (-r.top) / span;
    p = p < 0 ? 0 : (p > 1 ? 1 : p);
    /* 0 のとき歯車、1 のとき満開。途中で必ず確定ロゴ（0.5）を通る */
    hero.style.setProperty('--bloom', p.toFixed(3));
    path.setAttribute('d', markPath(p));
    ticking = false;
  }
  addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, { passive: true });
  addEventListener('resize', update, { passive: true });
  update();
})();

/* 見出しを1字ずつ立ち上げる（e-chubu の値をそのまま） */
(function () {
  var el = document.querySelector('.split');
  var rule = document.getElementById('rule');
  if (rule) rule.classList.add('is-visible');
  if (!el || !window.gsap || !window.SplitText) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gsap.registerPlugin(SplitText);
  document.fonts.ready.then(function () {
    SplitText.create(el, {
      type:'chars', autoSplit:true, charsClass:'js-char', tag:'span', reduceWhiteSpace:false,
      onSplit:function (self) {
        return gsap.from(self.chars, {
          scaleY:0.4, yPercent:10, alpha:0, duration:0.8,
          ease:'elastic.out(1.2,0.6)', stagger:0.025,
          onComplete:function(){ self.revert(); }
        });
      }
    });
  });
})();
</script>
</body>
</html>
